[package]
name = "devlokal-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aplikasi desktop devlokal (Tauri) — lapisan UI tipis di atas devlokal-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
devlokal-core = { path = "../crates/core" }
