[package]
name = "devlokal-core"
description = "Inti devlokal: unduhan hemat bandwidth, pengelola layanan, konfigurasi, hosts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
ureq = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
