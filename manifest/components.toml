# Manifest komponen devlokal.
#
# PENTING: berkas ini sengaja belum berisi URL dan checksum untuk PHP dan MariaDB.
# Isi dari sumber resmi masing-masing, lalu verifikasi sha256 sebelum dirilis:
#   - nginx   : https://nginx.org/en/download.html
#   - PHP     : https://windows.php.net/download/ (Windows); Linux/macOS: lihat docs/ARSITEKTUR.md
#   - MariaDB : https://mariadb.org/download/
#
# Selama sha256 kosong, `devlokal fetch` menolak mengunduh kecuali dengan --trust-first-use,
# yang hanya menampilkan checksum hasil unduhan agar bisa dicocokkan secara manual.
# Alternatif tanpa internet: `devlokal import <id> <arsip-atau-folder>`.
# Manifest komponen devlokal (Windows x64).
# Selama sha256 kosong, `devlokal fetch` menolak mengunduh komponen tersebut.

[[components]]
id = "nginx-1.30.5"
kind = "nginx"
version = "1.30.5"
note = "Sumber resmi nginx.org. sha256: isi dari Get-FileHash."

[components.sources.windows-x86_64]
url = "https://nginx.org/download/nginx-1.30.5.zip"
sha256 = "e5afe28b6a50bec92c478bfe1a4d3758206b80fb77159277bc5c4e88955c2a35"
archive = "zip"
strip = 1

